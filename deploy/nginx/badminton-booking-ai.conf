server {
    listen 80;
    listen [::]:80;
    server_name shuttlesync.space;

    return 301 https://shuttlesync.space$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shuttlesync.space;

    ssl_certificate /etc/letsencrypt/live/shuttlesync.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shuttlesync.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/projects/badminton-booking-ai/www;
    index index.html;

    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
