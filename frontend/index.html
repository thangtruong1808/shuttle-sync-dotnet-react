<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book a badminton court or join a public social. Shuttle Sync keeps the schedule, the payment, and the points in one place." />
    <meta name="theme-color" content="#f5f8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07140f" media="(prefers-color-scheme: dark)" />
    <meta id="theme-color" name="theme-color" content="#f5f8f4" />
    <meta property="og:title" content="Shuttle Sync" />
    <meta property="og:description" content="Book a badminton court or join a public social. Shuttle Sync keeps the schedule, the payment, and the points in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shuttle Sync" />
    <meta name="twitter:description" content="Book a badminton court or join a public social. Shuttle Sync keeps the schedule, the payment, and the points in one place." />
    <meta name="twitter:image" content="/icon-512.png" />
    <script>
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("shuttle-sync-theme") || "system";
        } catch (error) {}
        var hour = new Date().getHours();
        var autoDark = hour < 6 || hour >= 18;
        var dark = theme === "dark" || (theme !== "light" && autoDark);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var themeMeta = document.getElementById("theme-color");
        if (themeMeta) themeMeta.setAttribute("content", dark ? "#07140f" : "#f5f8f4");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Home · Shuttle Sync</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
